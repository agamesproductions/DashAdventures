<!doctype html>

<head>

    :root { color-scheme: dark; font-family: "Press Start 2P", "Courier New", monospace; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background:
        radial-gradient(ellipse at 50% 4%, rgba(80, 175, 207, .22), transparent 58%),
        linear-gradient(145deg, #102b46, #111b38 68%, #241d39);
      color: #fff;
    }
    main { width: min(100vw, 1000px); padding: 14px; }
    h1 { margin: 0 0 8px; color: #f5fbff; font-size: clamp(20px, 3vw, 28px); letter-spacing: .04em; text-shadow: 0 2px 0 #26375f, 0 0 18px rgba(111, 214, 240, .24); }
    .mode { margin-left: 8px; padding: 3px 6px; background: linear-gradient(180deg, #ffe58a, #ffb93d); color: #172d58; font-size: .55em; vertical-align: middle; box-shadow: 0 2px 0 #9c6438; }
    .frame { position: relative; overflow: hidden; border: 4px solid #fff2a1; border-radius: 3px; box-shadow: 0 0 0 2px rgba(91, 196, 224, .3), 0 8px 0 #09233b, 8px 16px 38px rgba(4, 10, 25, .48); }
    canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #29bce9; image-rendering: pixelated; image-rendering: crisp-edges; }
    canvas:focus-visible { outline: 3px solid #73e5f0; outline-offset: -7px; }
    .help { margin: 9px 2px 0; color: #c9dcf5; font-size: 14px; }
    .audio-controls { display: flex; justify-content: flex-end; margin-top: 8px; }
    .audio-controls button {
      min-height: 36px; padding: 5px 12px; border: 2px solid #fff2a1; border-radius: 4px;
      background: linear-gradient(180deg, #277e9e, #185978); color: white; font: bold 13px "Courier New", monospace; cursor: pointer;
      box-shadow: 0 3px 0 #0c3854; transition: transform .12s ease, filter .12s ease;
    }
    .audio-controls button:hover { filter: brightness(1.14); }
    .audio-controls button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0c3854; }
    .audio-controls button:disabled { opacity: .65; cursor: default; }
    .touch { display: none; gap: 8px; justify-content: space-between; margin-top: 10px; }
    .touch-group { display: flex; gap: 8px; }
    .touch button {
      min-width: 54px; min-height: 48px; border: 2px solid #fff2a1; border-radius: 4px;
      background: linear-gradient(180deg, #277e9e, #185978); color: white; font-size: 20px; touch-action: none;
      box-shadow: 0 3px 0 #0c3854; transition: transform .12s ease, filter .12s ease;
    }
    .touch button:active { transform: translateY(2px); filter: brightness(1.18); box-shadow: 0 1px 0 #0c3854; }
    @media (pointer: coarse) { .touch { display: flex; } }
  </style>
</head>

        }
      });
      window.addEventListener("keyup", e => keys.delete(e.code));
      window.addEventListener("blur", () => keys.clear());
      document.querySelectorAll(".touch button").forEach(button => {
        const key = button.dataset.key;
        button.addEventListener("pointerdown", e => {
          e.preventDefault(); ensureAudio(); keys.add(key);
          if (["Space", "ArrowUp", "KeyW"].includes(key)) pumpSpinDash();
        });
        for (const event of ["pointerup", "pointercancel", "lostpointercapture"]) button.addEventListener(event, () => keys.delete(key));
      });
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
